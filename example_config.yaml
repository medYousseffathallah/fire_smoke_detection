camera:
  source_type: usb
  device_index: 0
  file_path: ""
  rtsp_url: ""
  http_url: ""
  width: 640
  height: 480
  fps: 30
  use_gstreamer: false
  latency_ms: 80
  csi_sensor_id: 0
  rtsp_decoder: cpu

model:
  backend: onnx
  weights_path: best.onnx
  input_size: 640
  conf_thres: 0.35
  iou_thres: 0.45
  class_names: "fire,smoke"
  use_half: false
  onnx_providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]

temporal:
  ema_alpha: 0.6
  on_threshold: 0.6
  off_threshold: 0.4
  on_frames: 3
  off_frames: 5
  motion_gate: false
  motion_threshold: 0.08
  high_conf_bypass: 0.85

runtime:
  display: true
  queue_size: 2

